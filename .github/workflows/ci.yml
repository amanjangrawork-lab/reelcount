name: CI

on:
  push:
  pull_request:

jobs:
  javascript:
    name: TypeScript and ESLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx

  ktlint:
    name: Kotlin formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.2.1/ktlint
          chmod +x ktlint
          ./ktlint "android/app/src/**/*.kt"

  android:
    name: Unit tests and APKs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the SDK but leaves most package licences
      # unaccepted, and Gradle refuses to resolve compileSdk 34 until they are.
      - name: Accept Android SDK licences
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || echo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.6

      - name: Unit tests
        run: cd android && ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      # The release build is the only path that runs R8 with the project's
      # ProGuard rules, so CI has to build it or those rules stay unverified.
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/**
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: reelcount-apks
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: android/app/schemas/**
          if-no-files-found: ignore
