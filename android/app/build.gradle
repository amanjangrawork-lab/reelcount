apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "kotlin-kapt"
apply plugin: "com.facebook.react"

/**
 * React Native Gradle Plugin configuration. Defaults are fine here.
 */
react {
    // Folders, variants and bundling all use the React Native defaults.
}

// Side-load signing identity.
//
// A fresh debug keystore is generated on every CI runner, which gives every
// build a different signature: an update then refuses to install over the
// previous one ("App not installed"). This key is committed — encoded as base64
// text, because *.jks is git-ignored — so all side-load builds share one
// identity and upgrades work. It is a DEVELOPMENT key: replace it with a real
// release keystore before any Play Store distribution.
def devKeystoreFile = file("reelcount-dev.jks")
def devKeystoreBase64 = file("reelcount-dev.jks.base64")
if (!devKeystoreFile.exists() && devKeystoreBase64.exists()) {
    devKeystoreFile.bytes = Base64.decoder.decode(devKeystoreBase64.text.trim())
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.reelcount"

    signingConfigs {
        dev {
            storeFile devKeystoreFile
            storePassword "reelcountdev"
            keyAlias "reelcount"
            keyPassword "reelcountdev"
        }
    }

    defaultConfig {
        applicationId "com.reelcount"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "0.1.2"
        resourceConfigurations += ["en"]
    }

    buildFeatures {
        buildConfig true
    }

    // Both variants use the committed side-load key when it is available, so a
    // newer build installs over an older one. AGP's per-machine debug keystore is
    // the fallback.
    buildTypes {
        debug {
            signingConfig devKeystoreFile.exists() ? signingConfigs.dev : signingConfigs.debug
        }
        release {
            signingConfig devKeystoreFile.exists() ? signingConfigs.dev : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xjvm-default=all"]
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/AL2.0", "META-INF/LGPL2.1"]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // Kotlin + AndroidX basics.
    implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.activity:activity-ktx:1.8.2")

    // Coroutines for database work off the main thread.
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

    // Room persistence.
    implementation("androidx.room:room-runtime:2.6.1")
    implementation("androidx.room:room-ktx:2.6.1")
    kapt("androidx.room:room-compiler:2.6.1")

    // Unit tests run on the JVM. org.json is stubbed in android.jar, so the real
    // implementation is supplied for tests that cover the per-app JSON encoding.
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20240303")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Room schema export: committed under android/app/schemas so migrations can be
// written and tested against the real schema instead of guessing.
kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

// React Native 0.74 autolinking, app side.
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)
